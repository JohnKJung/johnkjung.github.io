    Publications:
      - title: "DIVO: Continuous-time DVL-Inertial-Visual Odometry for Unmanned Underwater Vehicles"
        authors:
          - Kyungmin Jung
          - Angad Bajwa
          - Junha Yoo
          - Arturo Del Castillo Bernal
          - James Richard Forbes
        publisher: ArXiv
        releaseDate: 2026-07
        url: https://arxiv.org/abs/2607.04615
        summary: This paper presents a novel acoustic-visual-inertial odometry solution leveraging a continuous-time trajectory estimation framework for unmanned underwater vehicles. Underwater environments present unique challenges for visual localization and mapping, such as light attenuation, illumination variance, and the presence of particulate matter.

      - title: "An Adaptive Graduated Nonconvexity Loss Function for Robust Nonlinear Least-Squares Solutions"
        authors:
          - Kyungmin Jung
          - Thomas Hitchcox
          - James Richard Forbes
        publisher: IEEE Transactions on Robotics
        releaseDate: 2024-07
        url: https://ieeexplore.ieee.org/document/10612227
        summary: The main contribution of this article is to combine these two approaches by using an adaptive kernel within a GNC optimization scheme. This brings a solution to least-squares problems that is robust to both outliers and initialization errors, without the need for model selection and tuning.

      - title: "Performance Evaluation of 3D Keypoint Detectors and Descriptors on Coloured Point Clouds in Subsea Environments"
        authors:
          - Kyungmin Jung
          - Thomas Hitchcox
          - James Richard Forbes
        publisher: IEEE International Conference on Robotics and Automation
        releaseDate: 2023-07
        url: https://ieeexplore.ieee.org/document/10160348
        summary: This paper aims to identify the best detector/descriptor pair using a challenging field dataset collected using a commercial underwater laser scanner.

