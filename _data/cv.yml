    Experience:
      - company: Voyis Imaging Inc.
        position: Graduate Student Researcher
        location: Waterloo, ON
        start_date: 2021
        end_date: 2026
        highlights:
          - Developed a real-time SLAM system fusing camera, DVL, IMU, and depth sensors within a continuous-time estimation framework for robust underwater navigation.
          - Deployed a deep-learned visual front-end accelerated via the ONNX runtime, significantly increasing local feature tracking reliability under severe visual degradation.
          - Developed robust non-convex optimization strategies and 3D feature descriptors to improve ICP-based point cloud registration for subsea laser SLAM.

      - company: ARA Robotique
        position: Graduate Student Researcher
        location: Montreal, QC
        start_date: 2019
        end_date: 2021
        highlights:
          - Designed and implemented a tightly-coupled LiDAR-inertial-visual SLAM state estimator for UAVs utilizing factor graph optimization.
          - Formulated IMU preintegration on Lie groups (manifolds) and implemented consistent visual feature marginalization techniques to preserve map consistency and bounded runtime.
          - Executed multi-sensor spatial/temporal intrinsic and extrinsic calibration routines via Kalibr, along with Allan variance stochastic modeling for IMU noise calibration.

      - company: Bell Flight
        position: Airframe Fatigue and Stress Analysis Intern
        location: Mirabel, QC
        start_date: 2018
        end_date: 2018
        highlights:
          - Evaluated structural fatigue life and multi-axial stress concentrations on composite bolted joint assemblies under flight loads.
          - Analyzed bypass and bearing stress distribution profiles across diverse composite laminate configurations.
          - Developed an automated structural analysis tool to accelerate joint fatigue verification workflows for airframe design engineers.

