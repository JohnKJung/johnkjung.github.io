  summary:
    I am a Ph.D. candidate in Robotics at DECAR research group, McGill University, Canada.
    My research interests include robot autonomy, specifically in the areas of robot perception, navigation, and mapping.
    I am passionate about developing algorithms and systems that enable robots to operate effectively in complex and dynamic environments.

